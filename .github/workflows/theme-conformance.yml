name: Theme conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: theme-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.0
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check theme contract
        run: >-
          node --input-type=module -e
          'const { validateTheme } = await import("@voyant-travel/theme/tooling");
          const report = await validateTheme({ projectRoot: process.cwd() });
          if (!report.ok) { console.error(JSON.stringify(report.diagnostics, null, 2)); process.exit(1); }'
      - name: Build theme
        run: >-
          node --input-type=module -e
          'const { buildTheme } = await import("@voyant-travel/theme/tooling");
          const report = await buildTheme({ projectRoot: process.cwd(), output: "inherit" });
          if (!report.ok) { console.error(JSON.stringify(report.diagnostics, null, 2)); process.exit(1); }'
